<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CloverAI Lab — GRE Analytical Writing</title>
    <meta
      name="description"
      content="Score and write GRE Issue essays against the official ETS scoring guide, 18 official scored responses and all 158 pool topics."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <meta name="theme-color" content="#3bb86e" />
    <meta property="og:title" content="CloverAI Lab — GRE Analytical Writing" />
    <meta
      property="og:description"
      content="Task-compliance checking, axis-by-axis evidence and anchored scoring for the GRE Issue task."
    />
    <meta property="og:image" content="/og.svg" />
    <script>
      // Applied before first paint so a chosen theme never flashes the other one.
      try {
        const saved = localStorage.getItem("clover.theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.dataset.theme = saved;
        }
        const lang = localStorage.getItem("clover.lang");
        if (lang) document.documentElement.lang = lang;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
