<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CloverAI Lab — GRE Analytical Writing</title>
    <meta
      name="description"
      content="Score and write GRE Issue essays against the official ETS scoring guide, 18 official scored responses and all 158 pool topics."
    />
    <link rel="canonical" href="https://cloverailab.com/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- iOS Safari ignores an SVG apple-touch-icon, so this one is a real PNG.
         Both bitmaps are generated by tools/make-social-images.mjs. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#3bb86e" />

    <!-- Open Graph. The image URL is absolute on purpose: LinkedIn, Facebook
         and Slack resolve og:image before they have a base URL, so a relative
         path silently yields no preview. It must also be a raster format --
         none of them fetch SVG. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CloverAI Lab" />
    <meta property="og:url" content="https://cloverailab.com/" />
    <meta property="og:title" content="CloverAI Lab — GRE Analytical Writing" />
    <meta
      property="og:description"
      content="Task-compliance checking, axis-by-axis evidence and anchored scoring for the GRE Issue task."
    />
    <meta property="og:image" content="https://cloverailab.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="CloverAI Lab — GRE Analytical Writing. Task-compliance checking, axis-by-axis evidence, and scoring anchored to 18 official responses."
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CloverAI Lab — GRE Analytical Writing" />
    <meta
      name="twitter:description"
      content="Task-compliance checking, axis-by-axis evidence and anchored scoring for the GRE Issue task."
    />
    <meta name="twitter:image" content="https://cloverailab.com/og.png" />

    <!-- Legacy fallback. Some scrapers, LinkedIn among them historically,
         look for this before Open Graph. -->
    <link rel="image_src" href="https://cloverailab.com/og.png" />

    <script>
      // Applied before first paint so a chosen theme never flashes the other one.
      try {
        const saved = localStorage.getItem("clover.theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.dataset.theme = saved;
        }
        const lang = localStorage.getItem("clover.lang");
        if (lang) document.documentElement.lang = lang;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
